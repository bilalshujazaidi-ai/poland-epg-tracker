name: Daily EPG Scrape

on:
  schedule:
    # 08:12 UTC daily (~9-10am Poland time depending on DST). Deliberately NOT
    # on the exact hour -- GitHub documents that scheduled workflows queued for
    # the top of the hour are more likely to be delayed or dropped entirely
    # during high load, since that's when the most schedules across all of
    # GitHub fire at once. Confirmed happening to us on 2026-09-16 (the 08:00
    # run never fired at all).
    - cron: "12 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional: specific date to scrape (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scraper (retrying on failure)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          # scraper.py records completion per-channel in scrape_log before
          # moving to the next one, so re-running it after a crash (a
          # transient network blip against the source site, Supabase, or
          # TMDb -- these currently raise uncaught and exit non-zero rather
          # than being caught and retried internally) safely skips whatever
          # channels are already done and only picks up the rest. No risk of
          # duplicate entries or redone work, so a plain retry loop here is
          # both safe and sufficient -- no need for retry logic inside
          # scraper.py itself.
          max_attempts=5
          delay=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== Attempt $attempt of $max_attempts ==="
            if python scraper.py; then
              echo "Scrape succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "All $max_attempts attempts failed."
          exit 1
