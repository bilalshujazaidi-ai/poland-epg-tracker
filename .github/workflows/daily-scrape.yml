name: Daily EPG Scrape

on:
  schedule:
    # Every 30 minutes from 10:00am UK time (09:00 UTC) through midnight UK
    # time (23:00 UTC; UK is UTC+1 under BST) -- ~29 scheduled opportunities
    # a day instead of one. This replaces the earlier single-fire-at-08:12
    # approach: that offset-from-the-hour trick was meant to dodge GitHub's
    # documented tendency to delay or silently drop scheduled workflows
    # during high load, but it still failed outright on 2026-09-16, and
    # again fired ~5 hours late on 2026-09-17. Spreading many attempts across
    # the day is a more robust fix than trying to dodge congestion on a
    # single one: short of an outage lasting the whole day, one of these WILL
    # eventually land. No wasted work on the later, redundant firings once a
    # day's scrape has already succeeded -- scraper.py already records
    # completion per-channel in scrape_log and skips channels already done,
    # so a run against an already-fully-scraped day finishes in well under a
    # minute (just per-channel existence checks, no real scraping/API work).
    #
    # NOTE: these are fixed UTC times. UK clocks fall back to GMT in late
    # October -- after that, 09:00/23:00 UTC will land at 9am/11pm UK time
    # instead of 10am/midnight (a 1-hour drift) until updated for the new
    # offset.
    - cron: "0,30 9-22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional: specific date to scrape (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scraper (retrying on failure)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          # scraper.py records completion per-channel in scrape_log before
          # moving to the next one, so re-running it after a crash (a
          # transient network blip against the source site, Supabase, or
          # TMDb -- these currently raise uncaught and exit non-zero rather
          # than being caught and retried internally) safely skips whatever
          # channels are already done and only picks up the rest. No risk of
          # duplicate entries or redone work, so a plain retry loop here is
          # both safe and sufficient -- no need for retry logic inside
          # scraper.py itself.
          max_attempts=5
          delay=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== Attempt $attempt of $max_attempts ==="
            if python scraper.py; then
              echo "Scrape succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "All $max_attempts attempts failed."
          exit 1
